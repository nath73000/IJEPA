seed: 13
device: "mps"


model:
  image_shape: [3, 32, 32]
  patch_shape: [4, 4]
  context_learning_rate: 0.001
  predictor_learning_rate: 0.001
  model_learning_rate: 0.001
  momentum: 0.996


  masking: 
    context_scale: [0.85, 1.0]
    target_scale: [0.15, 0.2]
    target_aspect_ratio: [0.5, 1.5]
    num_target_blocks: 4

  encoder:
    embedding_size: 256
    num_heads: 4
    num_layers: 6
    hidden_size: 512

  predictor:
    embedding_size: 128
    num_heads: 4
    num_layers: 3
    hidden_size: 256


training:
  batch_size:     128
  learning_rate:  0.001
  num_epochs:     50
  save_metrics_every: 20